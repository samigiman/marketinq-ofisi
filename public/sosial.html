<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Ulduzgram · Ulduz Marketinq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{--bg:#efe9df;--card:rgba(251,250,247,.82);--line:#dcd8cf;--ink:#1d211f;--ink-2:#5d635f;--ink-3:#8a8f8a;--acc:#1f5f4a;--soft:#e3ece7;--r:14px}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(239,233,223,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  header b{font-size:17px;font-weight:600} header span{color:var(--ink-2);font-size:12px}
  nav{margin-left:auto;display:flex;gap:4px}
  nav button{height:34px;padding:0 12px;border-radius:10px;color:var(--ink-2);font-weight:500}
  nav button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  main{max-width:1040px;margin:0 auto;padding:16px}
  .glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:var(--r);box-shadow:0 8px 24px rgba(30,32,28,.08)}
  .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:none}
  .feed{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .post .hd{display:flex;gap:10px;align-items:center;padding:12px 14px}
  .post .hd small{display:block;color:var(--ink-2);font-size:12px}
  .post svg{display:block;width:100%;height:auto}
  .post .tx{padding:10px 14px 4px}
  .post .meta{padding:0 14px 6px;color:var(--ink-2);font-size:12px}
  .post .cm{padding:0 14px 12px;font-size:13px}
  .post .cm div{padding:2px 0} .post .cm b{font-weight:600}
  .chat{display:grid;grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 100px)}
  .threads{overflow:auto;padding:8px}
  .threads button{display:flex;gap:10px;width:100%;text-align:left;padding:10px;border-radius:10px;align-items:center}
  .threads button.on{background:#fff}
  .threads .t{min-width:0;flex:1} .threads .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .threads .t small{display:block;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msgs{display:flex;flex-direction:column;overflow:hidden}
  .msgs .top{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
  .msgs .list{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:75%;padding:8px 12px;border-radius:12px;background:#fff;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .bub small{display:block;font-size:11px;color:var(--acc);font-weight:600}
  .bub i{display:block;font-style:normal;font-size:11px;color:var(--ink-3);text-align:right}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)} th{font-size:12px;color:var(--ink-2);font-weight:600}
  td.num{font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;width:120px} .bar i{display:block;height:100%;background:var(--acc)}
  .empty{color:var(--ink-2);text-align:center;padding:40px}
  .note{color:var(--ink-2);font-size:12px;margin:0 0 12px}
  @media (max-width:760px){.chat{grid-template-columns:1fr;height:auto}.threads{max-height:240px}.msgs{height:60vh} nav button{padding:0 8px}}
</style>
</head>
<body>
<header><b>Ulduzgram</b><span>Ulduz Marketinq komandasının öz şəbəkəsi</span>
  <nav><button data-v="feed" class="on">Lent</button><button data-v="chat">Chat</button><button data-v="report">Hesabat</button></nav></header>
<main id="view"></main>
<script type="module" src="sosial.js"></script>
</body>
</html>
